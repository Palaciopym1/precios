<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Precios PalacioPYM</title>
<meta name="description" content="Revisar los cambios de precio de la máquina de PalacioPYM.">
<meta name="theme-color" content="#6d3bbf">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Precios">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#eef0f3;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1f2430}
iframe{position:fixed;top:0;left:0;width:100%;height:100%;border:0}
#plan{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:#eef0f3;z-index:2}
[hidden]{display:none!important}
.caja{width:100%;max-width:380px;background:#fff;border-radius:18px;padding:24px 20px;text-align:center;box-shadow:0 6px 24px rgba(30,20,60,.12)}
.caja img{width:84px;height:84px;border-radius:20px}
.caja h1{font-size:21px;margin:12px 0 4px}
.caja p{font-size:15px;line-height:1.4;color:#5b6270;margin:6px 0 16px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px 12px;font-size:17px;font-weight:700;text-decoration:none;cursor:pointer;margin-top:10px}
.morado{background:#6d3bbf;color:#fff}
.verde{background:#1f9d55;color:#fff}
.suave{background:#eef0f3;color:#3a4150;font-size:15px;padding:12px}
.nota{font-size:14px;color:#5b6270;background:#f6f2fd;border-radius:12px;padding:12px;margin-top:12px;line-height:1.4}
/* lector de códigos de barras (la app lo pide; Google no deja usar la cámara dentro de su marco) */
#esc{position:fixed;inset:0;z-index:5;background:#000;display:flex;flex-direction:column}
#esc video{flex:1;width:100%;min-height:0;object-fit:cover;background:#000}
#esc .mira{position:absolute;left:8%;right:8%;top:32%;height:22%;border:4px solid #fff;border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);pointer-events:none}
#esc .linea{position:absolute;left:12%;right:12%;top:43%;height:3px;background:#e11d48;border-radius:3px;pointer-events:none;animation:latir 1.2s ease-in-out infinite}
@keyframes latir{50%{opacity:.35}}
#esc .txt{position:absolute;left:0;right:0;top:calc(32% - 56px);text-align:center;color:#fff;font-size:19px;font-weight:800;text-shadow:0 2px 6px rgba(0,0,0,.6);padding:0 16px}
#esc .pie{position:relative;z-index:2;background:#111;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
#esc .pie button{width:100%;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:800;background:#fff;color:#1f2430}
</style>
</head>
<body>
<!--
  Página de instalación de la app del celular de PalacioPYM.
  La app de verdad está en Google Apps Script (cuenta palaciopym@gmail.com) y se ve aquí
  dentro. Esta página solo pone el nombre, el ícono y el botón de instalar.
  La app saluda con { app: 'ppym', tipo: 'hola' } y pide instalar con { tipo: 'instalar' }.
  Si la app no saluda (Google no dejó mostrarla aquí dentro), esta página muestra su propio
  botón «Abrir la app» y su propio «Instalar»; ya instalada, abre la app de Google directo.
-->
<iframe id="app" title="Precios PalacioPYM" allow="clipboard-write; web-share"></iframe>
<!-- La app pide { tipo: 'escanear' }: esta página abre la cámara y le devuelve { tipo: 'codigo', codigo }. -->
<div id="plan" hidden>
  <div class="caja">
    <img src="icon-192.png" alt="">
    <h1>Precios PalacioPYM</h1>
    <p>Revisar los cambios de precio de la máquina.</p>
    <a class="btn morado" id="bAbrir" href="#">Abrir la app</a>
    <button class="btn verde" id="bInstalar" type="button" hidden>📲 Instalar en este celular</button>
    <div class="nota" id="nIphone" hidden>Para dejarla como ícono: toca <b>Compartir</b> (el cuadrito con la flecha ⬆️) y luego <b>Agregar a inicio</b>.</div>
    <div class="nota" id="nListo" hidden>Listo, quedó instalada. Ábrela desde el ícono <b>Precios</b>.</div>
    <button class="btn suave" id="bOtraVez" type="button">Intentar otra vez</button>
  </div>
</div>
<div id="esc" hidden>
  <video id="escV" playsinline muted autoplay></video>
  <div class="txt" id="escT">Apunta al código de barras</div>
  <div class="mira"></div><div class="linea"></div>
  <div class="pie"><button type="button" id="escX">Cancelar</button></div>
</div>
<script>
var APP = 'https://script.google.com/macros/s/AKfycbxCt1rQ3a_2ONVhXzAoN3kFmsUSIyATH2j4bazksg6NB8HN-8dIuAueXBr6vFTjd-yN/exec';
var ESPERA_TRAS_CARGAR = 5000;   // la app saluda antes de terminar de cargar; si no saludó en 5 s, no se pudo mostrar
var ESPERA_MAXIMA = 30000;       // internet muy lento: a los 30 s se ofrece abrirla directo
var aviso = null;
var desdeIcono = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
var instalada = desdeIcono;
var ua = navigator.userAgent || '';
var plataforma = /iPhone|iPad|iPod/i.test(ua) ? 'ios' : (/Android/i.test(ua) ? 'android' : 'otro');
var oyentes = [];
var saludo = false, relojes = [];
var marco = document.getElementById('app');
function $(id) { return document.getElementById(id); }
function estado() { return { app: 'ppym', tipo: 'estado', marco: true, instalable: !!aviso, instalada: instalada, plataforma: plataforma }; }
function avisar() { oyentes.forEach(function (w) { try { w.postMessage(estado(), '*'); } catch (e) {} }); pintarPlan(); }
function deGoogle(origen) { try { return /\.googleusercontent\.com$/.test(new URL(origen).hostname); } catch (e) { return false; } }

// --- Plan B: Google no dejó mostrar la app dentro de esta página ---
function pintarPlan() {
  $('bInstalar').hidden = !aviso || instalada;
  $('nIphone').hidden = !(plataforma === 'ios' && !instalada);
  $('nListo').hidden = !(instalada && !desdeIcono);
}
function sinSaludo() {
  if (saludo) return;
  limpiarRelojes();
  // Ya instalada (abierta desde el ícono): abre la app de Google de una vez.
  if (desdeIcono) { location.replace(APP + '?directo=1'); return; }
  pintarPlan();
  $('plan').hidden = false;
}
function limpiarRelojes() { relojes.forEach(clearTimeout); relojes = []; }
function cargar() {
  saludo = false; limpiarRelojes();
  $('plan').hidden = true;
  relojes.push(setTimeout(sinSaludo, ESPERA_MAXIMA));
  marco.src = APP;
}
marco.addEventListener('load', function () {
  if (!marco.getAttribute('src') || saludo) return;
  relojes.push(setTimeout(sinSaludo, ESPERA_TRAS_CARGAR));
});
$('bAbrir').href = APP + '?directo=1';   // directo=1: la app no manda de vuelta a esta página
$('bOtraVez').addEventListener('click', cargar);
$('bInstalar').addEventListener('click', function () {
  if (!aviso) return;
  var p = aviso; aviso = null;
  p.prompt();
  p.userChoice.then(function (r) { if (r && r.outcome === 'accepted') instalada = true; avisar(); }).catch(function () { avisar(); });
});

window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); aviso = e; avisar(); });
window.addEventListener('appinstalled', function () { instalada = true; aviso = null; avisar(); });
window.addEventListener('message', function (e) {
  var d = e.data || {};
  if (d.app !== 'ppym' || !e.source || !deGoogle(e.origin)) return;
  if (oyentes.indexOf(e.source) < 0) oyentes.push(e.source);
  if (d.tipo === 'hola') {
    saludo = true; limpiarRelojes(); $('plan').hidden = true;
    e.source.postMessage(estado(), '*'); return;
  }
  if (d.tipo === 'escanear') { escanearAbrir(e.source); return; }
  if (d.tipo === 'instalar') {
    if (!aviso) { e.source.postMessage({ app: 'ppym', tipo: 'resultado', resultado: 'no-disponible', plataforma: plataforma, instalada: instalada }, '*'); return; }
    var p = aviso; aviso = null;
    p.prompt();
    p.userChoice.then(function (r) {
      if (r && r.outcome === 'accepted') instalada = true;
      e.source.postMessage({ app: 'ppym', tipo: 'resultado', resultado: r ? r.outcome : 'dismissed', plataforma: plataforma }, '*');
      avisar();
    }).catch(function () {});
  }
});
// --- Lector de códigos: la app manda { tipo: 'escanear' } y recibe { tipo: 'codigo', codigo } ---
// Usa el lector del teléfono (BarcodeDetector) y, si no lo tiene (iPhone), ZXing.
var ESC = { fuente: null, stream: null, lector: null, zx: null, vivo: false, reloj: null };
var FORMATOS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'code_93', 'itf', 'codabar'];
var ZXING = ['https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js', 'https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js'];
function escResponder(datos) {
  var f = ESC.fuente; ESC.fuente = null;
  if (f) { try { datos.app = 'ppym'; datos.tipo = 'codigo'; f.postMessage(datos, '*'); } catch (e) {} }
}
function escParar() {
  ESC.vivo = false;
  clearTimeout(ESC.reloj);
  if (ESC.zx) { try { ESC.zx.reset(); } catch (e) {} ESC.zx = null; }
  if (ESC.stream) { ESC.stream.getTracks().forEach(function (t) { try { t.stop(); } catch (e) {} }); ESC.stream = null; }
  var v = $('escV'); try { v.pause(); } catch (e) {} v.srcObject = null;
  $('esc').hidden = true;
}
function escListo(codigo) {
  if (!ESC.vivo) return;
  codigo = String(codigo || '').trim();
  if (!codigo) return;
  try { if (navigator.vibrate) navigator.vibrate(80); } catch (e) {}
  escParar();
  escResponder({ codigo: codigo });
}
function escFallo(msg) { escParar(); escResponder({ error: msg }); }
function cargarScript(urls) {
  return new Promise(function (ok, mal) {
    var i = 0;
    (function otro() {
      if (window.ZXing) { ok(); return; }
      if (i >= urls.length) { mal(new Error('sin lector')); return; }
      var s = document.createElement('script'); s.src = urls[i++]; s.async = true;
      s.onload = function () { window.ZXing ? ok() : otro(); }; s.onerror = otro;
      document.head.appendChild(s);
    })();
  });
}
function escNativo() {
  return BarcodeDetector.getSupportedFormats().then(function (fs) {
    var usar = FORMATOS.filter(function (f) { return fs.indexOf(f) >= 0; });
    if (!usar.length) throw new Error('sin formatos');
    ESC.lector = new BarcodeDetector({ formats: usar });
    var v = $('escV');
    (function mirar() {
      if (!ESC.vivo) return;
      ESC.lector.detect(v).then(function (cs) {
        if (cs && cs.length) { escListo(cs[0].rawValue); return; }
        ESC.reloj = setTimeout(mirar, 120);
      }).catch(function () { ESC.reloj = setTimeout(mirar, 250); });
    })();
  });
}
function escZxing() {
  $('escT').textContent = 'Preparando el lector…';
  return cargarScript(ZXING).then(function () {
    if (!ESC.vivo) return;
    $('escT').textContent = 'Apunta al código de barras';
    var pistas = new Map();
    var F = ZXing.BarcodeFormat;
    pistas.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.CODE_93, F.ITF, F.CODABAR]);
    ESC.zx = new ZXing.BrowserMultiFormatReader(pistas, 150);
    ESC.zx.decodeFromStream(ESC.stream, $('escV'), function (r) { if (r) escListo(r.getText()); });
  });
}
function escanearAbrir(fuente) {
  if (ESC.vivo) escParar();
  ESC.fuente = fuente;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { escResponder({ error: 'Este celular no deja usar la cámara aquí. Escribe el código.' }); return; }
  ESC.vivo = true;
  $('escT').textContent = 'Apunta al código de barras';
  $('esc').hidden = false;
  navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }).then(function (st) {
    if (!ESC.vivo) { st.getTracks().forEach(function (t) { t.stop(); }); return; }
    ESC.stream = st;
    var v = $('escV'); v.srcObject = st;
    return v.play().catch(function () {}).then(function () {
      if ('BarcodeDetector' in window) return escNativo().catch(function () { return escZxing(); });
      return escZxing();
    });
  }).catch(function (e) {
    var n = e && e.name;
    if (n === 'NotAllowedError' || n === 'SecurityError') escFallo('Dale permiso a la cámara para escanear (en los ajustes del navegador). Mientras tanto, escribe el código.');
    else if (n === 'NotFoundError' || n === 'OverconstrainedError') escFallo('No encontré la cámara de este celular. Escribe el código.');
    else escFallo('No se pudo abrir el lector. Escribe el código.');
  });
}
$('escX').addEventListener('click', function () { escParar(); escResponder({ cancelado: true }); });
document.addEventListener('visibilitychange', function () { if (document.hidden && ESC.vivo) { escParar(); escResponder({ cancelado: true }); } });
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
cargar();
</script>
</body>
</html>
